on: [push, pull_request, workflow_dispatch]

name: CI

env:
  # --cfg=web_sys_unstable_apis is required to enable the web_sys clipboard API which egui_web uses
  # https://rustwasm.github.io/wasm-bindgen/api/web_sys/struct.Clipboard.html
  # https://rustwasm.github.io/docs/wasm-bindgen/web-sys/unstable-apis.html
  RUSTFLAGS: -D warnings --cfg=web_sys_unstable_apis
  RUSTDOCFLAGS: -D warnings
  # Store all generated artifacts here, so we can archive. In particular this overrides the behaviour
  # of using a temporary directory for `cargo install`
  CARGO_TARGET_DIR: cargo_target

jobs:
  test:
    name: cargo check, test, fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # For check target wasm32 - currently fails, needs work
          # targets: wasm32-unknown-unknown

      # Cache contents of cargo and target dirs, by runner os, arch and hash of `Cargo.lock`.
      # For some reason the examples just use `runner.os`, but we build for multiple architectures
      # so we include `runner.arch`.
      # This caches the overridden cargo target dir as well, to store results of any cargo install
      # See https://docs.github.com/en/actions/tutorials/build-and-test-code/rust#caching-dependencies
      # and https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#example-using-the-cache-action
      # Note this doesn't install cargo-packager, so we use a separate cache with "cargo-test"
      - name: Cache cargo and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            cargo_target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - run: sudo apt-get install libglib2.0-dev libgtk-3-dev libpango1.0-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo check --all-features
      - run: cargo test --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      # For check target wasm32 - currently fails, needs work
      # - run: cargo check --all-features --lib --target wasm32-unknown-unknown

  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # This is x64
          - os: ubuntu-latest
            RUST_TARGET: x86_64-unknown-linux-gnu
            ZIG_TARGET: x86_64-unknown-linux-gnu.2.17
            PLATFORM_NAME: linux-x64
            APPIMAGE_ARCH_NAME: x86_64
            TARGZ_ARCH_NAME: x86_64
            DEB_ARCH_NAME: amd64

          # This is arm64 (public repo only)
          - os: ubuntu-24.04-arm
            RUST_TARGET: aarch64-unknown-linux-gnu
            ZIG_TARGET: aarch64-unknown-linux-gnu.2.17
            PLATFORM_NAME: linux-arm64
            APPIMAGE_ARCH_NAME: aarch64
            TARGZ_ARCH_NAME: aarch64
            DEB_ARCH_NAME: arm64

          # This is intel
          - os: macos-15-intel
            RUST_TARGET: default
            ZIG_TARGET: default
            PLATFORM_NAME: macos-intel
            DMG_ARCH_NAME: x64

          # This is arm64
          - os: macos-15
            RUST_TARGET: default
            ZIG_TARGET: default
            PLATFORM_NAME: macos-apple-silicon
            DMG_ARCH_NAME: aarch64

          # This is x64
          - os: windows-latest
            RUST_TARGET: default
            ZIG_TARGET: default
            PLATFORM_NAME: windows-x64
            SETUP_ARCH_NAME: x64

          # This is arm64 (public repo only)
          - os: windows-11-arm
            RUST_TARGET: default
            ZIG_TARGET: default
            PLATFORM_NAME: windows-arm64
            SETUP_ARCH_NAME: arm64

    steps:
      - name: Building ${{ matrix.os }}
        run: echo "${{ matrix.os }} on ref ${{github.ref}} for event ${{github.event_name}}"

        # On Linux, we'll use cargo-zigbuild to target an older glibc version
        # for better compatibility
        # See https://hansott.codes/blog/cross-compiling-rust-with-zig-for-older-glibc-47
        # Note that we use a specific commit id to get a PR that updates to nodev24 to
        # avoid a warning from github actions. This page covers the warning:
        # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
        # This is the PR to update setup-zig:
        # https://codeberg.org/mlugg/setup-zig/pulls/55
        # If this is merged, e.g. as v3, then replace the commit id below with v3 to
        # go back to tracking updates of the action.
      - name: Install Zig
        if: contains(runner.os, 'Linux')
        uses: mlugg/setup-zig@272b55e6c4fcef353f6d923050ff32f018636378

      - name: Install Rust, dev packages and cargo-zigbuild on Linux
        if: contains(runner.os, 'Linux')
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{matrix.RUST_TARGET}}
          cargo install --locked cargo-zigbuild
          sudo apt-get install libglib2.0-dev libgtk-3-dev libpango1.0-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust on non-Linux
        if: contains(runner.os, 'Linux') == false
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout repository
        uses: actions/checkout@v7

      # We don't want to use @master, so we use a commit id.
      # If this issue is done we can use @v1 instead:
      # https://github.com/nicolaiunrein/cargo-get/issues/113
      - name: Get Metadata from Cargo.toml
        id: metadata
        uses: nicolaiunrein/cargo-get@597a0a7ed638a120eadba0bbcc418b54a4ab3672

      # This requires that the certificate p12 file contains an ID matching `signing-identity` in `Cargo.toml`
      - name: Install the Apple certificate and provisioning profile
        if: contains(runner.os, 'macOS')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # App Store Connect API Key
          API_KEY_P8_BASE64: ${{ secrets.API_KEY_P8_BASE64 }}
          # skip provisioning profile
          # BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          # Our Apple Store Connect API Key private key file path, for notarization
          # We use this to decode to, it will be used later by cargo-packager
          APPLE_API_KEY_PATH=$RUNNER_TEMP/api_key.p8
          # skip provisioning profile
          # PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          # import certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          # import API Key from secrets
          echo -n "$API_KEY_P8_BASE64" | base64 --decode -o $APPLE_API_KEY_PATH          
          # skip provisioning profile
          # echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Skip provisioning profile
          # apply provisioning profile
          # mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      # Cache contents of cargo and target dirs, by runner os, arch and hash of `Cargo.lock`.
      # For some reason the examples just use `runner.os`, but we build for multiple architectures
      # so we include `runner.arch`.
      # This caches the overridden cargo target dir as well, to store results of cargo install
      # See https://docs.github.com/en/actions/tutorials/build-and-test-code/rust#caching-dependencies
      # and https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#example-using-the-cache-action
      - name: Cache cargo and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            cargo_target
          key: ${{ runner.os }}-${{ runner.arch }}-${{matrix.RUST_TARGET}}-${{matrix.ZIG_TARGET}}-v1-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-packager
        run: |
          cargo install cargo-packager --locked --git https://github.com/mountainlizard/cargo-packager.git --branch fix-nsis-file-associations

      - name: Build on non-Linux
        if: contains(runner.os, 'Linux') == false
        run: |
          cargo build --release

      - name: Build with zigbuild on Linux
        if: contains(runner.os, 'Linux')
        run: |
          cargo zigbuild --target ${{matrix.ZIG_TARGET}} --release
          # Note that we are building to a specific architecture - even if this matches
          # the arch we're running on, we still get a target output named by arch
          # Cargo packager expects it to be in the default target dir, so we copy
          # the binary across
          cp ./cargo_target/${{matrix.RUST_TARGET}}/release/${{steps.metadata.outputs.package_name}} ./cargo_target/release/${{steps.metadata.outputs.package_name}}

      - name: Package
        env:
          # Only used on macos, for cargo-packager notarisation
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/api_key.p8
        run: |
          cargo packager --release

      - name: Rename NSIS installer
        if: contains(runner.os, 'Windows')
        run: |
          mv cargo_target/release/${{steps.metadata.outputs.package_name}}_${{ steps.metadata.outputs.package_version}}_${{matrix.SETUP_ARCH_NAME}}-setup.exe cargo_target/release/${{steps.metadata.outputs.package_name}}-${{steps.metadata.outputs.package_version}}-${{matrix.PLATFORM_NAME}}-setup.exe
      
      - name: Archive NSIS installer
        if: contains(runner.os, 'Windows')
        uses: actions/upload-artifact@v7
        with:
          name: nsis-installer-windows-${{ runner.arch }}
          path: |
            cargo_target/release/*setup.exe
          if-no-files-found: error

      - name: Rename windows exe
        if: contains(runner.os, 'Windows')
        run: |
          mv cargo_target/release/${{steps.metadata.outputs.package_name}}.exe cargo_target/release/${{steps.metadata.outputs.package_name}}-${{ steps.metadata.outputs.package_version}}-${{matrix.PLATFORM_NAME}}.exe

      - name: Archive exe
        if: contains(runner.os, 'Windows')
        uses: actions/upload-artifact@v7
        with:
          name: exe-windows-${{ runner.arch }}
          path: cargo_target/release/${{steps.metadata.outputs.package_name}}-${{ steps.metadata.outputs.package_version}}-${{matrix.PLATFORM_NAME}}.exe
          if-no-files-found: error

      - name: Rename macOS dmg
        if: contains(runner.os, 'macOS')
        run: |
          mv cargo_target/release/MountainTiles_${{ steps.metadata.outputs.package_version}}_${{matrix.DMG_ARCH_NAME}}.dmg cargo_target/release/${{steps.metadata.outputs.package_name}}-${{steps.metadata.outputs.package_version}}-${{matrix.PLATFORM_NAME}}.dmg

      - name: Archive macOS dmg
        if: contains(runner.os, 'macOS')
        uses: actions/upload-artifact@v7
        with:
          name: dmg-installer-macos-${{ runner.arch }}
          path: |
            cargo_target/release/*.dmg
          if-no-files-found: error

      - name: Rename Linux deb
        if: contains(runner.os, 'Linux')
        run: |
          mv cargo_target/release/${{steps.metadata.outputs.package_name}}_${{ steps.metadata.outputs.package_version}}_${{matrix.DEB_ARCH_NAME}}.deb cargo_target/release/${{steps.metadata.outputs.package_name}}-${{steps.metadata.outputs.package_version}}-${{matrix.PLATFORM_NAME}}.deb

      - name: Archive Linux deb
        if: contains(runner.os, 'Linux')
        uses: actions/upload-artifact@v7
        with:
          name: deb-installer-linux-${{ runner.arch }}
          path: |
            cargo_target/release/*.deb
          if-no-files-found: error

      - name: Rename Linux AppImage
        if: contains(runner.os, 'Linux')
        run: |
          mv cargo_target/release/${{steps.metadata.outputs.package_name}}_${{ steps.metadata.outputs.package_version}}_${{matrix.APPIMAGE_ARCH_NAME}}.AppImage cargo_target/release/${{steps.metadata.outputs.package_name}}-${{steps.metadata.outputs.package_version}}-${{matrix.PLATFORM_NAME}}.AppImage

      - name: Archive Linux AppImage
        if: contains(runner.os, 'Linux')
        uses: actions/upload-artifact@v7
        with:
          name: appimage-linux-${{ runner.arch }}
          path: |
            cargo_target/release/*.AppImage
          if-no-files-found: error

      - name: Rename Linux tar.gz
        if: contains(runner.os, 'Linux')
        run: |
          mv cargo_target/release/${{steps.metadata.outputs.package_name}}_${{ steps.metadata.outputs.package_version}}_${{matrix.TARGZ_ARCH_NAME}}.tar.gz cargo_target/release/${{steps.metadata.outputs.package_name}}-${{steps.metadata.outputs.package_version}}-${{matrix.PLATFORM_NAME}}.tar.gz

      - name: Archive Linux tar.gz
        if: contains(runner.os, 'Linux')
        uses: actions/upload-artifact@v7
        with:
          name: tar-gz-linux-${{ runner.arch }}
          path: |
            cargo_target/release/*.tar.gz
          if-no-files-found: error

  release:
    name: Release with artifacts
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [test, build-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Upload artifacts to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.RELEASE_TOKEN }}
          file: "**/*"
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
